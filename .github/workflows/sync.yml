name: Untis Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python untis_sync.py
        env:
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
      - name: Datei speichern
        run: |
          git config user.name "untis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stundenplan.ics
          git diff --cached --quiet || git commit -m "Stundenplan aktualisiert"
          git push
